<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serwis u simaka</title>
    <link rel="stylesheet" href="style_servis.css">
</head>
<body>

    <!-- Логотип и заголовок остаются всегда видимыми -->
    <img src="img/photo_2025-04-27_19-17-52.jpg" class="img-logo" alt="Logo Serwis u simaka">
    <h1 class="title">Serwis u simaka</h1>

    <!-- Блок, который будем показывать/прятать -->
    <div class="container_start" id="search-block">
        <h2 class="text1">Wprowadź swoje dane:</h2>
        <div class="search-wrapper">
            <input type="text" class="input-search" placeholder="Tablice rejestracyjne" required>
            <button type="button" class="button-search" onclick="toggleSearch()">Szukaj</button>
        </div>
    </div>

    <!-- Здесь позже появится результат поиска (пока скрыто) -->
    <div id="result-block" class="result-container hidden">
        <h2>Wyniki wyszukiwania dla:</h2>
        <p id="plate-number">—</p>
        <!-- Тут будет информация о машине / услугах / цене и т.д. -->
        <button onclick="goBack()">Wróć</button>
    </div>

    <script src="js.js"></script>
</body>
</html>
